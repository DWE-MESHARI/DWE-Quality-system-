<script type="module">
  // يحمّل js/app.js، وإن لم يوجد (رفع الملفات بدون مجلدات) يحمّل app.js من نفس المستوى
  const ok = async u => { try { return (await fetch(u, { method: 'HEAD' })).ok } catch (e) { return false } };
  const p = (await ok('js/app.js')) ? './js/app.js' : './app.js';
  import(p).catch(e => { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:12px;color:#b00">تعذّر تحميل ملفات النظام (' + p + '). تأكدي أن مجلدي css وjs مرفوعان في المستودع بنفس الهيكل.</p>'); console.error(e) });
</script>
